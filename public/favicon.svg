<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#16122b"/>
      <stop offset="100%" stop-color="#06050c"/>
    </radialGradient>

    <linearGradient id="veil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a89be0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6b5ca0" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="iris" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#c4b5ff"/>
      <stop offset="50%" stop-color="#7b68d4"/>
      <stop offset="100%" stop-color="#3d2f7a"/>
    </radialGradient>

    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#3d3558" stroke-width="1.2" opacity="0.6"/>

  <!-- Soft ambient glow behind the eye -->
  <ellipse cx="128" cy="118" rx="68" ry="42" fill="#8b7cc8" opacity="0.07"/>

  <!-- ========== EYE (clean & stylized) ========== -->
  <!-- Sclera -->
  <ellipse cx="128" cy="118" rx="48" ry="26" fill="#f0ecff" opacity="0.95"/>

  <!-- Iris -->
  <circle cx="128" cy="118" r="17" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="128" cy="118" r="7.5" fill="#1a1430"/>

  <!-- Main catchlight -->
  <circle cx="122" cy="112" r="3.5" fill="#ffffff" opacity="0.9"/>
  <!-- Secondary catchlight -->
  <circle cx="134" cy="123" r="1.6" fill="#ffffff" opacity="0.4"/>

  <!-- Thin elegant upper lid line -->
  <path d="M82 116 C96 98, 112 90, 128 90 C144 90, 160 98, 174 116"
        fill="none" stroke="#2a2440" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Thin elegant lower lid line -->
  <path d="M84 122 C98 136, 114 144, 128 144 C142 144, 158 136, 172 122"
        fill="none" stroke="#2a2440" stroke-width="2.8" stroke-linecap="round"/>

  <!-- ========== VEIL (light & elegant) ========== -->
  <!-- Soft rear layer -->
  <path d="M50 98
           C70 72, 96 56, 128 52
           C160 56, 186 72, 206 98
           C198 130, 178 158, 152 176
           C138 186, 130 190, 128 192
           C126 190, 118 186, 104 176
           C78 158, 58 130, 50 98Z"
        fill="#b0a0e0" opacity="0.12"/>

  <!-- Main translucent veil -->
  <path d="M58 104
           C76 80, 100 64, 128 60
           C156 64, 180 80, 198 104
           C190 132, 172 158, 148 174
           C136 184, 130 188, 128 190
           C126 188, 120 184, 108 174
           C84 158, 66 132, 58 104Z"
        fill="url(#veil)" opacity="0.5"/>

  <!-- Left fold -->
  <path d="M66 112
           C82 90, 104 74, 126 70
           C118 94, 112 120, 110 146
           C108 160, 110 172, 114 180
           C96 168, 78 144, 70 122
           C68 116, 66 112, 66 112Z"
        fill="#d8d0f8" opacity="0.22"/>

  <!-- Right fold -->
  <path d="M190 112
           C174 90, 152 74, 130 70
           C138 94, 144 120, 146 146
           C148 160, 146 172, 142 180
           C160 168, 178 144, 186 122
           C188 116, 190 112, 190 112Z"
        fill="#d8d0f8" opacity="0.22"/>

  <!-- Sheer central panel (lightly over the lower eye) -->
  <path d="M98 108
           C110 92, 120 82, 128 80
           C136 82, 146 92, 158 108
           C152 128, 144 148, 136 162
           C132 168, 129 172, 128 174
           C127 172, 124 168, 120 162
           C112 148, 104 128, 98 108Z"
        fill="#f4f0ff" opacity="0.18"/>

  <!-- Soft glowing top edge -->
  <path d="M62 106
           C82 80, 104 66, 128 62
           C152 66, 174 80, 194 106"
        fill="none" stroke="url(#highlight)" stroke-width="2.2" stroke-linecap="round" opacity="0.65" filter="url(#glow)"/>

  <!-- Clean fold lines -->
  <g stroke="#e0d8ff" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M72 114 C88 94, 108 78, 126 74" stroke-width="1.2"/>
    <path d="M184 114 C168 94, 148 78, 130 74" stroke-width="1.2"/>
    <path d="M80 130 C94 112, 112 98, 126 94" stroke-width="0.9"/>
    <path d="M176 130 C162 112, 144 98, 130 94" stroke-width="0.9"/>
  </g>

  <!-- Subtle vertical seams -->
  <g stroke="#c8b8f0" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.25">
    <path d="M114 95 C112 122, 112 150, 116 175"/>
    <path d="M142 95 C144 122, 144 150, 140 175"/>
  </g>

  <!-- Tiny light points -->
  <g fill="#e8e0ff">
    <circle cx="94" cy="84" r="1.1" opacity="0.5"/>
    <circle cx="162" cy="84" r="1.1" opacity="0.5"/>
    <circle cx="112" cy="72" r="0.8" opacity="0.35"/>
    <circle cx="144" cy="72" r="0.8" opacity="0.35"/>
    <circle cx="128" cy="96" r="0.9" opacity="0.4"/>
  </g>
</svg>
